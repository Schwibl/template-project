name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (actions/checkout@v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node (actions/setup-node@v4)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: npm run lint
        run: npm run lint
      - name: npm run typecheck
        run: npm run typecheck
      - name: npm test
        run: npm test
      - name: npm run build
        run: npm run build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (actions/checkout@v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node (actions/setup-node@v4)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: npm run e2e
        run: npm run e2e
      - name: Upload Playwright report (actions/upload-artifact@v4)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
